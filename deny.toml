[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
exceptions = [
	{ crate = "ring", allow = ["ISC"] },
	{ crate = "rustls-webpki", allow = ["ISC"] },
	{ crate = "untrusted", allow = ["ISC"] },
	{ crate = "subtle", allow = ["BSD-3-Clause"] },
	{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
